services:
  db:
    image: postgres:16-alpine
    container_name: reactapp-db
    environment:
      POSTGRES_USER: todos
      POSTGRES_PASSWORD: todos
      POSTGRES_DB: todos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todos -d todos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: reactapp-backend
    environment:
      DATABASE_URL: postgresql://todos:todos@db:5432/todos
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: reactapp-frontend
    ports:
      # host:container — nginx listens on 8080 inside the container
      - "3000:8080"
    # SELinux on Fedora rootless Podman can block nginx log/device access
    security_opt:
      - label=disable
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
