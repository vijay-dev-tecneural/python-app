# React + nginx frontend: ConfigMap (proxy) + Deployment + Service
# nginx proxies /api → Service "backend:8000" (same as Compose).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: reactapp
  labels:
    app: frontend
data:
  nginx.conf: |
    worker_processes auto;
    error_log /tmp/error.log warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        access_log /tmp/access.log;
        sendfile on;
        keepalive_timeout 65;

        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;

        # K8s DNS (CoreDNS). "backend" is the Service name in this namespace.
        # Optional resolver if you use variables; plain proxy_pass is enough here.
        server {
            listen 8080;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;

            # ---- reverse proxy to FastAPI Service ----
            location /api/ {
                proxy_pass http://backend:8000/api/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /docs {
                proxy_pass http://backend:8000/docs;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
            }

            location /openapi.json {
                proxy_pass http://backend:8000/openapi.json;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
            }

            # ---- static React (Vite build) ----
            location / {
                try_files $uri $uri/ /index.html;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: reactapp
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Build & push, or load into kind/minikube:
          #   podman build -t reactapp-frontend:latest ./frontend
          image: reactapp-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            # Override image nginx.conf so proxy target stays correct in-cluster
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: reactapp
  labels:
    app: frontend
spec:
  # ClusterIP + Ingress is typical; use NodePort for quick local demos without Ingress.
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
